<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PhonePe approves checkouts by referrer domain: send this site's origin (overrides any server header). -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex">
    <title>Secure Checkout - LegalShaadi</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #020617; color: #e2e8f0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
        .box { max-width: 22rem; padding: 1.5rem; }
        .spin { width: 2rem; height: 2rem; margin: 0 auto 1rem; border: 3px solid #334155; border-top-color: #a855f7;
                border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        a { color: #c084fc; }
        .err { color: #fca5a5; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div id="spin" class="spin"></div>
        <p id="msg">🔒 PhonePe Secure Checkout khul raha hai…</p>
        <noscript><p class="err">Payment ke liye JavaScript on karein.</p></noscript>
    </div>
    <script>
        // Launcher for the payment gateway: redirect.html#<base64url PhonePe checkout URL>.
        // Forwards only to https PhonePe hosts, so this page can't be used as an open redirect.
        (function () {
            function decode(b64url) {
                var b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
                while (b64.length % 4) b64 += '=';
                var bin = atob(b64);
                var bytes = new Uint8Array(bin.length);
                for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                return new TextDecoder().decode(bytes);
            }

            function fail() {
                document.getElementById('spin').style.display = 'none';
                var msg = document.getElementById('msg');
                msg.className = 'err';
                msg.innerHTML = '⚠️ Payment link sahi nahi hai ya expire ho gaya hai. <a href="/">Wapas jaayein</a> aur dobara try karein.';
            }

            var target;
            try {
                target = new URL(decode(location.hash.slice(1)));
            } catch (e) {
                return fail();
            }
            var host = target.hostname;
            if (target.protocol !== 'https:' || !(host === 'phonepe.com' || /\.phonepe\.com$/.test(host))) return fail();
            location.replace(target.href);
        })();
    </script>

</body>
</html>
